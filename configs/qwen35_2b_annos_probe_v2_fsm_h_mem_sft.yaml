# Spatial H-Memory Cross-Attention PoC: H -> structured spatial memory -> cross-attn.
#
# The frozen vision-comparison module already produced H. This config turns H into a
# multi-channel spatial memory (gradients / multi-scale / local contrast / PE), condenses
# it to K=64 memory tokens via a small CNN, and injects it into Qwen with a residual
# cross-attention on selected decoder layers:
#     Y_l = QwenBlock_l(X_l);  C_l = CrossAttn(Q=LN(Y_l), K=Z_H, V=Z_H);  X = Y + tanh(g_l) C_l.
#
# Mechanism probe: freeze ViT / Qwen base / FSM LoRA (--freeze-lora) / RegionAdapter
# (--freeze-region-adapter). Trainable: HMemory (encoder + cross-attn) only.
# [localize] target is GT-anchored (outcome.sft.localize_target=gt) so H is only a
# conditioning prior, never the supervision -- otherwise cross-attn just learns to
# read H back out of the memory (the shortcut).
paths:
  dataset_root: /root/data-fs/bljiao/datasets
  output_dir: ./outputs/train/qwen35_2b_outcome_multibox
runtime:
  mode: train
  run_name: qwen35_2b_annos_probe_v2_fsm_h_mem
  auto_create_output_dir: true
tensorboard:
  port: 5017
  host: 0.0.0.0
  log_every_n_steps: 10
  vis_every_n_steps: 20
  vis_num_samples: 5
model:
  random_init_llm: false
  arch: Qwen3.5-2B
  name: /root/data-fs/bljiao/anomaly_llm/model_card/Qwen3.5-2B
  local_files_only: true
  freeze_vit: true
  torch_dtype: bfloat16
prior:
  layer_index_base: 1
  layer_indices:
  - 12
  - 16
  - 20
  - 24
  softmax_temperature: 0.5
  neighborhood_radius: 0
  render: colormap
  overlay_alpha: 0.45
lora:
  enabled: true
  skip_visual: true
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  - in_proj_qkv
  - in_proj_z
  - in_proj_a
  - in_proj_b
  - out_proj
data:
  train_layout: visa
  train_root: /root/data-fs/bljiao/datasets/VisA
  eval_layout: mvtec
  eval_root: /root/data-fs/bljiao/datasets/mvtec_anomaly_detection
  visa_max_normal_per_class: null
  min_contour_area: 5
  merge_kernel_ratio: 0.01
  gt_source: annos
  annos_root: /root/data-fs/bljiao/anomaly_llm/datasets/ANNOS
  source_dirname: VisA
  train_anomaly_only: false
  random_train_ref: true
  ref_topk: 5
  normal_anomaly_ratio: 1.0
  holdout_ratio: 0.1
  max_samples: null
  max_eval_samples: null
  max_image_size: 448
  factor: null
  min_pixels: null
  max_pixels: null
prompt:
  enable_thinking: true
  template: |
    Image 1 is a defect-free reference of {class_name}. Image 2 is the inspection image.
    A set of region evidence tokens follows, grouped by H candidate: {region_tokens}. Each token encodes the inspection content at that location, its matched normal counterpart, and the discrepancy between them. hK@[x,y] marks the H peak on Image 2 in [0,1000] for the first token of that group; tokens after it describe the same H region, not only the peak cell. Hints are noisy, not labels: a marked location may be a false alarm (reflection, texture, print), and real defects may be unmarked. Start from these regions when proposing boxes, expand to the full differing structure, and search beyond the marked locations too.
    bboxes_2d is a list of boxes, and each box is itself a list [x1,y1,x2,y2]. A single defect must be written as [[x1,y1,x2,y2]] (a list containing one box), never as the flat list [x1,y1,x2,y2].
    Example (anomalous): <answer>{"is_anomaly": true, "bboxes_2d": [[120, 200, 480, 620]], "description": "a defect on the upper-left"}</answer>
    Example (normal): <answer>{"is_anomaly": false, "bboxes_2d": [], "description": "no defect; appearance matches the reference"}</answer>
    For anomaly=true, bboxes_2d contains one box per spatially disconnected anomalous region, with no duplicates and at most {max_boxes} boxes.
    For anomaly=false, bboxes_2d MUST be [].
    All boxes are integers [x1,y1,x2,y2] in [0,1000] for Image 2 FULL IMAGE, with x1<x2 and y1<y2 (x1=left, y1=top, x2=right, y2=bottom).
    Stop immediately after </answer>.
training:
  max_length: 4096
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  seed: 42
  eval_every_n_steps: 20
  eval_split: dev
  eval_num_samples: 200
  final_eval_num_samples: null
outcome:
  version: outcome-multibox-v1
  protocol_weight: 0.01
  max_boxes: 16
  thinking:
    enabled: true
  localization:
    iou_threshold: 0.30
    geometry_weight: 0.30
  # [localize] supervision: GT boxes (H is only a conditioning prior, never target).
  sft:
    localize_target: gt
  sft_adapter: outputs/train/region_sft_annos_think_fsm   # frozen FSM baseline start point
  final_test: false
  prior:
    condition: real          # proposals always from real H (ablation only perturbs memory)
    relative_threshold: 0.7
    raw_threshold: null
    max_candidates: 3
    min_cells: 1
    box_mode: full
    peak_radius: 1
    peak_keep: 0.85
    region_feature_index: 23
    h_image_size: 768
  region:
    intermediate_dim: 256
    geometry_dim: 5
    hstat_dim: 2
    activation: gelu
    max_cells: 15
    token_mode: hybrid
  zoom:
    enabled: false
    h_image_size: 768
    crop_image_size: 448
    expand: 1.5
    max_crops: 3
  # Spatial H-Memory cross-attention PoC. Kept off by default in other configs.
  h_memory:
    enabled: true
    # Memory-side ablation (independent of prior.condition): proposals/region tokens
    # always come from real H; only the H map fed to the memory encoder is perturbed.
    #   real     -> real H
    #   shuffled -> fixed per-sample shuffled H (spatial structure destroyed)
    #   zero     -> all-zero H (PE remains)
    condition: real
    layers: [11, 19]         # 0-based decoder layer indices (full-attn layers)
    memory_size: 64          # K = 8x8 spatial prior memory tokens
    mem_dim: 256             # per-token memory dim
    num_heads: 8             # cross-attn heads (hidden 2048 / 8 = head_dim 256)
    init_gate: 0.001         # small nonzero gate; --gate-lr drives it up during training
