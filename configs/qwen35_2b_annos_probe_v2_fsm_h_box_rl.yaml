# ANNOS-GT probe v2: new protocol (understand→compare→ground+location→verify;
# description = location + reason). Fresh SFT, do not reuse region_sft_annos_probe.
# Do not use this yaml to eval old hybrid adapters (those must merge region_sft_multibox_2b).
# TensorBoard 5009 = thinking SFT; RL uses 5010.
paths:
  dataset_root: /root/data-fs/bljiao/datasets
  output_dir: ./outputs/train/qwen35_2b_outcome_multibox
runtime:
  mode: train
  run_name: qwen35_2b_annos_probe_v2_h_box
  auto_create_output_dir: true
tensorboard:
  port: 5010
  host: 0.0.0.0
  log_every_n_steps: 10
  vis_every_n_steps: 20
  vis_num_samples: 5   # 每 vis_every_n_steps 从缓冲随机抽 N 个训练样本可视化
model:
  random_init_llm: false
  arch: Qwen3.5-2B
  name: /root/data-fs/bljiao/anomaly_llm/model_card/Qwen3.5-2B
  local_files_only: true
  freeze_vit: true
  torch_dtype: bfloat16
prior:
  layer_index_base: 1
  layer_indices:
  - 12
  - 16
  - 20
  - 24
  softmax_temperature: 0.5
  neighborhood_radius: 0
  render: colormap
  overlay_alpha: 0.45
lora:
  enabled: true
  skip_visual: true
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  - in_proj_qkv
  - in_proj_z
  - in_proj_a
  - in_proj_b
  - out_proj
data:
  train_layout: visa
  train_root: /root/data-fs/bljiao/datasets/VisA
  eval_layout: mvtec
  eval_root: /root/data-fs/bljiao/datasets/mvtec_anomaly_detection
  visa_max_normal_per_class: null
  min_contour_area: 5   # findContours 去噪阈值(px)，MDPI Algorithms 2026 论文默认 5
  merge_kernel_ratio: 0.01   # AD-FM(AAAI'26) 式碎片合并：膨胀核 = 短边*ratio，0=不合并；0.01≈7-10px
  gt_source: annos   # mask=官方像素mask轮廓框；annos=MMR-AD 人标框（缺省回退 mask）
  annos_root: /root/data-fs/bljiao/anomaly_llm/datasets/ANNOS
  source_dirname: VisA
  train_anomaly_only: false
  random_train_ref: true
  ref_topk: 5
  normal_anomaly_ratio: 1.0
  # 0 = 用全部 VisA 训练，不留 VisA holdout（dev）；测试完全交给 MVTec。
  holdout_ratio: 0.0
  max_samples: null
  max_eval_samples: null
  max_image_size: 448
  factor: null
  min_pixels: null
  max_pixels: null
prompt:
  enable_thinking: true
  template: |
    Image 1 is a defect-free reference of {class_name}. Image 2 is the inspection image.
    An external anomaly-prior heatmap is provided as a search hint: it marks where the
    inspection image most differs from the reference, but it is only a heuristic, not a
    label. Some highlighted regions may be false alarms, and real defects may not be
    perfectly centered, so inspect the images directly and expand beyond the hint when needed.
    bboxes_2d is a list of boxes, and each box is itself a list [x1,y1,x2,y2]. A single defect must be written as [[x1,y1,x2,y2]] (a list containing one box), never as the flat list [x1,y1,x2,y2].
    Example (anomalous): <answer>{"is_anomaly": true, "bboxes_2d": [[120, 200, 480, 620]], "description": "a defect on the upper-left"}</answer>
    Example (normal): <answer>{"is_anomaly": false, "bboxes_2d": [], "description": "no defect; appearance matches the reference"}</answer>
    For anomaly=true, bboxes_2d contains one box per spatially disconnected anomalous region, with no duplicates and at most {max_boxes} boxes.
    For anomaly=false, bboxes_2d MUST be [].
    All boxes are integers [x1,y1,x2,y2] in [0,1000] for Image 2 FULL IMAGE, with x1<x2 and y1<y2 (x1=left, y1=top, x2=right, y2=bottom).
    Stop immediately after </answer>.
training:
  max_length: 4096
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  seed: 42
  eval_every_n_steps: 20
  eval_split: test   # 中间评估在 MVTec 测试集上做（VisA 全集训练，无 holdout）
  eval_num_samples: 200
  final_eval_num_samples: null
grpo:
  group_size: 8
  policy_epochs: 3
  epochs: 2
  max_attempts: 800
  learning_rate: 5.0e-06
  gradient_accumulation_steps: 1
  max_new_tokens: 768
  # FSM staged decode rollout (KV-cached U→C→L→V→answer). Controller-injected
  # [stage] markers are masked out of logprob/advantage.
  staged_rollout: true
  max_stage_tokens: 96
  max_localize_tokens: 256
  max_answer_tokens: 192
  # 大显存服务器：micro batch = group_size，整组一次前向/生成，不再拆小批
  rollout_micro_batch_size: 8
  logprob_micro_batch_size: 8
  actor_micro_batch_size: 8
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  scale_rewards: true
  clip_low: 0.2
  clip_high: 0.28
  kl_beta: 0.0002
  max_grad_norm: 1.0
  save_steps: 100
  logprob_error_tolerance: 0.1
  # Confirm-reject reloop: [confirm]=reject -> distrust H and CONTINUE into a
  # second [localize]->[confirm] pass with NO H tokens (pure text+image). The
  # reject tokens stay in the completion so GRPO's sequence-level advantage +
  # reward.reject_weight can learn *when* to reject. max_loops is a safety cap.
  # reject_logit_bias seeds exploration of the reject verdict on the first
  # [confirm] token (SFT teaches only keep/none), decaying to 0 over
  # reject_bias_anneal_steps; reward.reject_weight then takes over shaping.
  confirm_reloop:
    enabled: true
    max_loops: 3
    reject_logit_bias: 3.0
    reject_bias_anneal_steps: 200
distributed:
  num_gpu: 1
  deepspeed: null
  local_rank: -1
  ddp_find_unused_parameters: false
outcome:
  version: outcome-multibox-v1
  protocol_weight: 0.01
  max_boxes: 16   # findContours GT p95=9 / p99=20 on VisA-train (see data.scan.compute_max_boxes)
  thinking:
    enabled: true   # native <think>; SFT supervises [understand]/[compare]/[localize]/[confirm] then JSON
  localization:
    iou_threshold: 0.30
    geometry_weight: 0.30
  reward:
    # Fine-grained reward (AD-FM style):
    #   wrong_decision | normal_correct + focus_weight*focus | cls_weight + iou_weight*mask_iou
    #   + count_weight*count + dense_weight*loc + cand_weight*cand_coverage
    #   + refine_weight*clip(delta_refine, +-refine_clip)
    normal_correct: 1.0    # positive attractor for correct rejections
    wrong_decision: -1.0
    false_positive_penalty: -2.0   # normal image declared anomalous is penalized twice as hard as a miss
    cls_weight: 0.0        # extra base reward for correct anomaly decision
    iou_weight: 0.5        # AD-Copilot BBox-Mask IoU (primary localization term)
    count_weight: 0.2      # explicit box-count reward (|m-n|=0 -> 1, 1 -> 0.5, >=2 -> -0.1)
    dense_weight: 0.3      # DCLR dense term (early non-zero gradient)
    focus_weight: 0.2      # normal-sample focus reward (localize-then-reject)
    focus_max_candidates: 3   # focus band: 1..3 candidates -> +0.5, >3 -> -0.1
    refine_weight: 0.1     # two-sided clipped refine term (improving candidate earns capped bonus)
    refine_clip: 0.2       # clip on delta_refine -> max +-refine_weight*clip = +-0.02
    cand_weight: 0.2       # candidate-stage GT coverage recall @IoU>=cand_iou_threshold (no count penalty)
    cand_iou_threshold: 0.1
    cand_max_area_frac: 0.1   # anti giant-box hack: bigger candidates don't count for coverage/focus
    reject_weight: 0.2     # confirm-reject shaping: reject += weight*(2*mask_iou-1) on anomalies,
                           # so a reject that rescues localization is rewarded, a pointless reject penalized
  resampling:
    min_loc_range: 0.001
    max_group_resamples: 3
  sft_adapter: outputs/train/region_sft_annos_think_fsm_h_box_v1   # H-Box SFT (geometry-token prior + VPT)
  final_test: false
  prior:
    # High-res H-map resolution (the scalar heatmap fed to the VPT encoder). Must
    # match the SFT run so the frozen H-VPT sees the same H distribution.
    h_image_size: 768
    # H connected-component candidate boxes (H-Box geometry-token prior source).
    relative_threshold: 0.7
    raw_threshold: null
    max_candidates: 3
    min_cells: 1
    box_mode: full
    peak_radius: 1
    peak_keep: 0.85
  # H-Box geometry-token prior (IAD-Unify style): inject H connected-component
  # bboxes as STATIC geometry tokens. Loaded frozen from
  # outcome.sft_adapter/h_box_prior.pt (trained by train_region_sft.py). Parallel
  # to h_vpt for a clean ablation; can be removed once validated.
  h_box_prior:
    enabled: true
    condition: real          # real | shuffled | zero (causal ablation)
    max_boxes: 3             # K <|h_box|> slots (== prior.max_candidates)
    geom_dim: 11             # x1,y1,x2,y2,cx,cy,w,h,area,peak,is_valid
  # VPT-style H cross-attention: the single H channel into the LLM. Loaded frozen
  # from outcome.sft_adapter/h_vpt.pt (trained by train_region_sft.py).
  h_vpt:
    enabled: true
    condition: real          # real | shuffled | zero (causal ablation)
    n_tokens: 64             # N <|h_feat|> slots = N h_H tokens
    mem_dim: 256             # z_H token dim (HFeatureEncoder output)
    num_heads: 8             # cross-attention heads
    init_gate: 0.001         # zero-init projector gate (exact baseline parity)
    # RL 阶段让 reward 塑形 H 的使用。projector(cross-attn) 训练会导致 KL 爆炸
    # （softmax 对参数扰动敏感 + 64 个 feat token 经 self-attn 放大），故只训练
    # 标量 gate：学会"整体信不信 H"。encoder+projector 冻结，保留底层语义。
    # none=frozen | gate_only | gate_projector | all。
    trainable: gate_only
    lr: 0.01                 # gate 单独 lr（标量，需远大于 base 5e-6 才能打开）
