# World-model SFT (single-pass internal thinking): train_region_sft.py
#
#   python train_region_sft.py \
#     --config configs/qwen35_2b_world_model_sft.yaml \
#     --output-dir outputs/train/world_model_sft_2b \
#     --epochs 1 --num-gpu 1
#
# Supervises the FULL autoregressive thought chain [understand]...[confirm]</think><answer>
# token-by-token (no marker masking), including reject/refine multi-round intermediate
# states (outcome.sft). H is a static search hint in the prompt, never the training target.
paths:
  dataset_root: /root/data-fs/bljiao/datasets
  output_dir: ./outputs/train/world_model_sft_2b
runtime:
  mode: train
  run_name: qwen35_2b_world_model_sft
  auto_create_output_dir: true
tensorboard:
  port: 5011
  host: 0.0.0.0
  log_every_n_steps: 10
  vis_every_n_steps: 20
  vis_num_samples: 5
model:
  random_init_llm: false
  arch: Qwen3.5-2B
  name: /root/data-fs/bljiao/anomaly_llm/model_card/Qwen3.5-2B
  local_files_only: true
  freeze_vit: true
  torch_dtype: bfloat16
prior:
  layer_index_base: 1
  layer_indices:
  - 12
  - 16
  - 20
  - 24
  softmax_temperature: 0.5
  neighborhood_radius: 0
  render: colormap
  overlay_alpha: 0.45
lora:
  enabled: true
  skip_visual: true
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  - in_proj_qkv
  - in_proj_z
  - in_proj_a
  - in_proj_b
  - out_proj
data:
  train_layout: visa
  train_root: /root/data-fs/bljiao/datasets/VisA
  eval_layout: mvtec
  eval_root: /root/data-fs/bljiao/datasets/mvtec_anomaly_detection
  visa_max_normal_per_class: null
  min_contour_area: 5
  merge_kernel_ratio: 0.01
  gt_source: annos
  annos_root: /root/data-fs/bljiao/anomaly_llm/datasets/ANNOS
  source_dirname: VisA
  train_anomaly_only: false
  random_train_ref: true
  ref_topk: 5
  normal_anomaly_ratio: 1.0
  holdout_ratio: 0.0   # full VisA for training; evaluation is entirely on MVTec
  max_samples: null
  max_eval_samples: null
  max_image_size: 768
  factor: null
  min_pixels: null
  max_pixels: null
prompt:
  enable_thinking: true
  template: |
    Image 1 is a defect-free reference of {class_name}. Image 2 is the inspection image.
    An external anomaly-prior heatmap is provided as a search hint: it highlights the
    candidate regions where the inspection image most differs from the reference. Each
    candidate region is encoded as a geometry token (location and extent) embedded in this
    prompt: {h_box_tokens}. A dense visual-prior cross-attention is additionally injected
    via control/feature tokens: {h_vpt_tokens}. These are only heuristics, not labels —
    some may be false alarms, and real defects may be unmarked or imperfectly centered.
    Inspect the images directly, verify each candidate against the Image 1 baseline, and
    expand beyond the hint when needed.
    Reason inside your thinking as: understand the reference, compare the differences and
    why, localize candidate boxes, imagine whether each candidate actually matches the
    defect (keep / refine / reject / none), then confirm the decision that follows from
    your rehearsal (keep / refine / reject / none). Finally output only <answer>.
    In your thinking and in the "description" field, describe each anomaly in your own
    words: what you actually observe in that region and why it cannot be normal for this
    object, instead of only saying it "differs from the baseline".
    Example (anomalous): <answer>{"is_anomaly": true, "bboxes_2d": [[120, 200, 480, 620]], "description": "a defect on the upper-left"}</answer>
    Example (normal): <answer>{"is_anomaly": false, "bboxes_2d": [], "description": "no defect; appearance matches the reference"}</answer>
    For anomaly=true, bboxes_2d contains one box per spatially disconnected anomalous region, with no duplicates and at most {max_boxes} boxes.
    For anomaly=false, bboxes_2d MUST be [].
    All boxes are integers [x1,y1,x2,y2] in [0,1000] for Image 2 FULL IMAGE, with x1<x2 and y1<y2 (x1=left, y1=top, x2=right, y2=bottom).
    Stop immediately after </answer>.
training:
  max_length: 4096
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  seed: 42
  eval_every_n_steps: 100
  eval_split: test
  eval_num_samples: 200
  final_eval_num_samples: null
grpo:
  group_size: 8
  policy_epochs: 3
  epochs: 2
  max_attempts: null
  learning_rate: 5.0e-06
  gradient_accumulation_steps: 1
  max_new_tokens: 1024
  rollout_micro_batch_size: 8
  logprob_micro_batch_size: 8
  actor_micro_batch_size: 8
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  scale_rewards: true
  clip_low: 0.2
  clip_high: 0.28
  kl_beta: 0.0002
  max_grad_norm: 1.0
  save_steps: 100
  logprob_error_tolerance: 0.1
distributed:
  num_gpu: 1
  deepspeed: null
  local_rank: -1
  ddp_find_unused_parameters: false
outcome:
  version: outcome-multibox-v1
  protocol_weight: 0.01
  max_boxes: 16
  reasoning_mode: fsm
  thinking:
    enabled: true
  # P0 intermediate-state SFT sampling probabilities (train_region_sft.py).
  # Each round is a (localize, imagine, confirm) triple: the model rehearses whether
  # its candidate matches the defect ([imagine]) before committing ([confirm]).
  sft:
    p_keep: 0.5            # [localize]=GT, [imagine]=keep, [confirm]=keep (single round)
    p_refine_small: 0.2    # [localize]=shrunken GT, [imagine]/[confirm]=refine, then GT+keep
    p_refine_shift: 0.2    # [localize]=shifted GT, [imagine]/[confirm]=refine, then GT+keep
    p_reject: 0.1          # [localize]=H false-positive, [imagine]/[confirm]=reject, then GT+keep
    refine_small_scale: 0.5
    refine_shift_frac: 0.3
    p_normal_reject_none: 0.5   # normal: reject one H false alarm, then none
    # Zoom-crop SFT: this fraction of single-box anomalous samples is trained with a
    # 3-image prompt (ref + test + zoom crop) whose target consults the outlined crop
    # to correct an undersized candidate back to the GT extent. Normal samples and the
    # remaining anomaly samples keep the 2-image path.
    zoom_prob: 0.3
    zoom_shrink_scale: 0.5   # candidate box is shrunk to this scale to simulate undershoot
    # Correction-continuation SFT (stage-2 prefix perturbation, NOT supervised as a
    # stage-1 target). correction_p_empty returns an empty candidate set (teaches
    # "discover"); correction_p_drop drops some GT components (teaches recovering
    # missing boxes). Start values, not yet validated optima.
    correction_p_empty: 0.15
    correction_p_drop: 0.35
  localization:
    iou_threshold: 0.30
    geometry_weight: 0.30
  reward:
    normal_correct: 1.0
    wrong_decision: -1.0
    false_positive_penalty: -2.0
    cls_weight: 0.0
    iou_weight: 0.5
    count_weight: 0.2
    dense_weight: 0.3
    focus_weight: 0.2
    focus_max_candidates: 3
    refine_weight: 0.1
    refine_clip: 0.2
    cand_weight: 0.2
    cand_iou_threshold: 0.1
    discrim_weight: 0.1    # rule-verifier anchor: confirm verdict vs GT (confirm_discrim_acc)
  resampling:
    min_loc_range: 0.001
    max_group_resamples: 3
  # H-Box geometry-token prior (static linear projection, no gate / no cross-attn).
  # Trained during SFT and saved as h_box_prior.pt next to the LoRA adapter.
  h_box_prior:
    enabled: true
    max_boxes: 3            # K <|h_box|> slots (== prior.max_candidates)
    geom_dim: 11
  # H-VPT dense cross-attention (dynamic H channel): trained during SFT and saved as
  # h_vpt.pt next to the LoRA adapter. H patch map -> z_H -> control-token cross-attn
  # -> h_H scattered into <|h_ctrl|> + N <|h_feat|> slots.
  h_vpt:
    enabled: true
    condition: real
    n_tokens: 64
    mem_dim: 256
    num_heads: 8
    init_gate: 0.001
  final_test: false
  # Zoom-crop geometry used by the SFT observation planning (train_region_sft.py).
  zoom:
    enabled: true
    expand: 0.3            # per-side pad = expand * box size
    min_pad_frac: 0.04     # window floor = min_pad_frac * image longer side
    max_area_frac: 0.6     # degrade to global view when the window covers this fraction
    coverage_scan: false   # also scan the whole image for single candidates (ablation)
    crop_min_pixels: null  # crop upscale budget floor (null -> max_image_size^2 // 2)
  prior:
    relative_threshold: 0.7
    raw_threshold: null
    max_candidates: 3
    min_cells: 1
    box_mode: full
    peak_radius: 1
    peak_keep: 0.85
    region_feature_index: 23
