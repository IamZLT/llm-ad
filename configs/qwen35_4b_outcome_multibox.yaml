# outcome-multibox-v1 GRPO 入口: python train_outcome_multibox.py --config configs/qwen35_4b_outcome_multibox.yaml
# 4B 视觉塔 depth=24，与 2B 相同，prior 层沿用 50/67/83/100%：blocks 11/15/19/23
# SFT 冷启动：python train_region_sft.py --config configs/qwen35_4b_outcome_multibox.yaml \
#   --output-dir outputs/train/region_sft_multibox_4b --epochs 2 --lr 1e-4 --save-steps 1000
paths:
  dataset_root: /root/data-fs/bljiao/datasets
  output_dir: ./outputs/train/qwen35_4b_outcome_multibox
runtime:
  mode: train
  run_name: qwen35_4b_outcome_multibox
  auto_create_output_dir: true
tensorboard:
  port: 5005
  host: 0.0.0.0
  log_every_n_steps: 10
  vis_every_n_steps: 100
  vis_num_samples: 5   # 每 vis_every_n_steps 从缓冲随机抽 N 个训练样本可视化
model:
  random_init_llm: false
  arch: Qwen3.5-4B
  name: /root/data-fs/bljiao/anomaly_llm/model_card/Qwen3.5-4B
  local_files_only: true
  freeze_vit: true
  torch_dtype: bfloat16
prior:
  layer_index_base: 1
  layer_indices:
  - 12
  - 16
  - 20
  - 24
  softmax_temperature: 0.5
  neighborhood_radius: 0
  render: colormap
  overlay_alpha: 0.45
lora:
  enabled: true
  skip_visual: true
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  - in_proj_qkv
  - in_proj_z
  - in_proj_a
  - in_proj_b
  - out_proj
data:
  train_layout: visa
  train_root: /root/data-fs/bljiao/datasets/VisA
  eval_layout: mvtec
  eval_root: /root/data-fs/bljiao/datasets/mvtec_anomaly_detection
  visa_max_normal_per_class: null
  min_contour_area: 5   # findContours 去噪阈值(px)，MDPI Algorithms 2026 论文默认 5
  merge_kernel_ratio: 0.01   # AD-FM(AAAI'26) 式碎片合并：膨胀核 = 短边*ratio，0=不合并；0.01≈7-10px
  gt_source: annos
  annos_root: /root/data-fs/bljiao/anomaly_llm/datasets/ANNOS
  source_dirname: VisA
  train_anomaly_only: false
  random_train_ref: true
  ref_topk: 5
  normal_anomaly_ratio: 1.0
  holdout_ratio: 0.1
  max_samples: null
  max_eval_samples: null
  max_image_size: 448
  factor: null
  min_pixels: null
  max_pixels: null
prompt:
  enable_thinking: true
  template: |
    Image 1 is a defect-free reference of {class_name}. Image 2 is the inspection image.
    A set of region evidence tokens follows, one per candidate location: {region_tokens}. Each token encodes the inspection content at that location, its matched normal counterpart, and the discrepancy between them. They are noisy hints, not labels: a marked location may be a false alarm caused by the object's own properties (reflections on glossy or transparent material, natural texture, print patterns), and real defects may be unmarked. Consider what normal {class_name} material and appearance variation looks like; trust a hint only when the reference confirms a true structural difference, and search beyond the marked locations too.
    <answer>
    {"is_anomaly": false, "bboxes_2d": [], "description": "brief result; if anomalous, approximate location and why it is a defect vs normal variation"}
    </answer>
    For anomaly=true, bboxes_2d contains one box per spatially disconnected anomalous region, with no duplicates and at most {max_boxes} boxes.
    For anomaly=false, bboxes_2d MUST be [].
    All boxes are integers [x1,y1,x2,y2] in [0,1000] for Image 2 FULL IMAGE, with x1<x2 and y1<y2.
    Stop immediately after </answer>.
training:
  max_length: 4096
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  seed: 42
  eval_every_n_steps: 100
  eval_split: test
  eval_num_samples: 200
  final_eval_num_samples: null
grpo:
  group_size: 8
  policy_epochs: 3
  epochs: 2
  max_attempts: null
  learning_rate: 5.0e-06
  gradient_accumulation_steps: 1
  max_new_tokens: 2048
  # 大显存服务器：micro batch = group_size，整组一次前向/生成，不再拆小批
  rollout_micro_batch_size: 8
  logprob_micro_batch_size: 8
  actor_micro_batch_size: 8
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  scale_rewards: true
  clip_low: 0.2
  clip_high: 0.28
  kl_beta: 0.0002
  max_grad_norm: 1.0
  save_steps: 100
  logprob_error_tolerance: 0.1
distributed:
  num_gpu: 1
  deepspeed: null
  local_rank: -1
  ddp_find_unused_parameters: false
outcome:
  version: outcome-multibox-v1
  protocol_weight: 0.01
  max_boxes: 16   # findContours GT p95=9 / p99=20 on VisA-train (see data.scan.compute_max_boxes)
  thinking:
    enabled: true   # native <think>; SFT supervises [understand]/[compare]/[localize]/[confirm] then JSON
  localization:
    iou_threshold: 0.30
    geometry_weight: 0.30
  reward:
    # Fine-grained reward (AD-FM style):
    #   wrong_decision | normal_correct + focus_weight*focus | cls_weight + iou_weight*mask_iou
    #   + count_weight*count + dense_weight*loc + cand_weight*cand_coverage
    #   + refine_weight*clip(delta_refine, +-refine_clip)
    normal_correct: 1.0    # positive attractor for correct rejections
    wrong_decision: -1.0
    cls_weight: 0.0        # extra base reward for correct anomaly decision
    iou_weight: 0.5        # AD-Copilot BBox-Mask IoU (primary localization term)
    count_weight: 0.2      # explicit box-count reward (|m-n|=0 -> 1, 1 -> 0.5, >=2 -> -0.1)
    dense_weight: 0.3      # DCLR dense term (early non-zero gradient)
    focus_weight: 0.2      # normal-sample focus reward (localize-then-reject)
    focus_max_candidates: 3   # focus band: 1..3 candidates -> +0.5, >3 -> -0.1
    refine_weight: 0.1     # two-sided clipped refine term (improving candidate earns capped bonus)
    refine_clip: 0.2       # clip on delta_refine -> max +-refine_weight*clip = +-0.02
    cand_weight: 0.2       # candidate-stage GT coverage recall @IoU>=cand_iou_threshold (no count penalty)
    cand_iou_threshold: 0.1
    cand_max_area_frac: 0.1   # anti giant-box hack: bigger candidates don't count for coverage/focus
  resampling:
    min_loc_range: 0.001
    max_group_resamples: 3
  sft_adapter: outputs/train/region_sft_multibox_4b/checkpoint-750
  final_test: false
  prior:
    condition: real
    relative_threshold: 0.7
    raw_threshold: null
    max_candidates: 3
    min_cells: 1
    # Which vision block (0-based, must be one of the layer_indices block indices)
    # supplies per-patch features for region contrast tokens. Default: last block.
    region_feature_index: 23
  # H-guided region contrast tokens (the only prior channel). H candidates are turned
  # into <|region|> placeholder tokens whose embeddings come from models/region_adapter.py.
  # The adapter is trained by train_region_sft.py and loaded from outcome.sft_adapter.
  region:
    intermediate_dim: 256
    geometry_dim: 5
    hstat_dim: 2
    activation: gelu
    max_cells: 12
    token_mode: grid
  zoom:
    enabled: false
    h_image_size: 768
    crop_image_size: 448
    expand: 1.5
    max_crops: 3
