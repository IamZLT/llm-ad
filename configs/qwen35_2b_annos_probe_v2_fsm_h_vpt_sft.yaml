# VPT-style H injection (final consolidated scheme).
#
# H@768 -> scalar anomaly heatmap (frozen vision comparison) -> deterministic
# multi-channel post-processing -> HFeatureEncoder (z_H spatial tokens) ->
# HControlProjector cross-attention (Q=z_H, K/V=<|h_ctrl|> LLM hidden) -> h_H
# scattered into N <|h_feat|> placeholder slots inside [localize].
#
# This is the ONLY way H reaches the LLM. All prior channels are removed:
# no RegionAdapter, no HPriorAdapter, no HMemory, no zoom crops, no router,
# no H-stat branch, no H peak text coordinates, no H-weighted pooling.
# H is a search prior, never the label.
paths:
  dataset_root: /root/data-fs/bljiao/datasets
  output_dir: ./outputs/train/qwen35_2b_outcome_multibox
runtime:
  mode: train
  run_name: qwen35_2b_annos_probe_v2_fsm_h_vpt
  auto_create_output_dir: true
tensorboard:
  port: 5019
  host: 0.0.0.0
  log_every_n_steps: 10
  vis_every_n_steps: 20
  vis_num_samples: 5
model:
  random_init_llm: false
  arch: Qwen3.5-2B
  name: /root/data-fs/bljiao/anomaly_llm/model_card/Qwen3.5-2B
  local_files_only: true
  freeze_vit: true
  torch_dtype: bfloat16
prior:
  layer_index_base: 1
  layer_indices:
  - 12
  - 16
  - 20
  - 24
  softmax_temperature: 0.5
  neighborhood_radius: 0
  render: colormap
  overlay_alpha: 0.45
lora:
  enabled: true
  skip_visual: true
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  - in_proj_qkv
  - in_proj_z
  - in_proj_a
  - in_proj_b
  - out_proj
data:
  train_layout: visa
  train_root: /root/data-fs/bljiao/datasets/VisA
  eval_layout: mvtec
  eval_root: /root/data-fs/bljiao/datasets/mvtec_anomaly_detection
  visa_max_normal_per_class: null
  min_contour_area: 5
  merge_kernel_ratio: 0.01
  gt_source: annos
  annos_root: /root/data-fs/bljiao/anomaly_llm/datasets/ANNOS
  source_dirname: VisA
  train_anomaly_only: false
  random_train_ref: true
  ref_topk: 5
  normal_anomaly_ratio: 1.0
  holdout_ratio: 0.1
  max_samples: null
  max_eval_samples: null
  max_image_size: 448
  factor: null
  min_pixels: null
  max_pixels: null
prompt:
  enable_thinking: true
  template: |
    Image 1 is a defect-free reference of {class_name}. Image 2 is the inspection image.
    An external anomaly-prior heatmap is provided as a search hint: it marks where the
    inspection image most differs from the reference, but it is only a heuristic, not a
    label. Some highlighted regions may be false alarms, and real defects may not be
    perfectly centered, so inspect the images directly and expand beyond the hint when needed.
    bboxes_2d is a list of boxes, and each box is itself a list [x1,y1,x2,y2]. A single defect must be written as [[x1,y1,x2,y2]] (a list containing one box), never as the flat list [x1,y1,x2,y2].
    Example (anomalous): <answer>{"is_anomaly": true, "bboxes_2d": [[120, 200, 480, 620]], "description": "a defect on the upper-left"}</answer>
    Example (normal): <answer>{"is_anomaly": false, "bboxes_2d": [], "description": "no defect; appearance matches the reference"}</answer>
    For anomaly=true, bboxes_2d contains one box per spatially disconnected anomalous region, with no duplicates and at most {max_boxes} boxes.
    For anomaly=false, bboxes_2d MUST be [].
    All boxes are integers [x1,y1,x2,y2] in [0,1000] for Image 2 FULL IMAGE, with x1<x2 and y1<y2 (x1=left, y1=top, x2=right, y2=bottom).
    Stop immediately after </answer>.
training:
  max_length: 4096
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  seed: 42
  eval_every_n_steps: 20
  eval_split: dev
  eval_num_samples: 200
  final_eval_num_samples: null
# Minimal decode budget for the in-training FSM rollout smoke eval (quick_rollout_eval).
grpo:
  staged_rollout: true
  max_stage_tokens: 96
  max_answer_tokens: 192
  # Confirm-reject reloop: [confirm]=reject -> distrust H, re-run L->V with zeroed
  # H until accept. Inert until RL teaches 'reject' (SFT only teaches keep/none).
  # max_loops is a safety cap (not a soft budget): accept is the only normal exit.
  confirm_reloop:
    enabled: true
    max_loops: 3
outcome:
  version: outcome-multibox-v1
  protocol_weight: 0.01
  max_boxes: 16
  thinking:
    enabled: true
  localization:
    iou_threshold: 0.30
    geometry_weight: 0.30
  # [localize] supervision: GT boxes (H is only a search prior, never target).
  sft:
    localize_target: gt
  sft_adapter: outputs/train/region_sft_annos_think_fsm   # frozen FSM baseline start point (LoRA init)
  final_test: false
  prior:
    # High-res H-map resolution (the scalar heatmap fed to the VPT encoder).
    h_image_size: 768
    # H connected-component candidate boxes (H-Box geometry-token prior source).
    relative_threshold: 0.7
    raw_threshold: null
    max_candidates: 3
    min_cells: 1
    box_mode: full
    peak_radius: 1
    peak_keep: 0.85
  # H-Box geometry-token prior (IAD-Unify style): inject H connected-component
  # bboxes as STATIC geometry tokens — a direct "look here, at this size" prior
  # that the model refines into precise bboxes_2d. Parallel to h_vpt (dense
  # feature cross-attn); kept separate for a clean ablation. Once validated,
  # h_vpt can be removed (single H channel).
  h_box_prior:
    enabled: true
    condition: real          # real | shuffled | zero (causal ablation)
    max_boxes: 3             # K <|h_box|> slots (== prior.max_candidates)
    geom_dim: 11             # x1,y1,x2,y2,cx,cy,w,h,area,peak,is_valid
  # VPT-style H cross-attention: the single H channel into the LLM.
  h_vpt:
    enabled: true
    condition: real          # real | shuffled | zero (causal ablation)
    n_tokens: 64             # N <|h_feat|> slots = N h_H tokens
    mem_dim: 256             # z_H token dim (HFeatureEncoder output)
    num_heads: 8             # cross-attention heads
    init_gate: 0.001         # zero-init projector gate (exact baseline parity)
