# World-model RL (single-pass internal thinking): train_outcome_multibox.py
#
#   python train_outcome_multibox.py --config configs/qwen35_2b_world_model_rl.yaml --mode train
#
# Single-shot autoregressive rollout (no external FSM / staged decode). The model writes
# the whole [understand]...[confirm]</think><answer> chain in one pass. Reward is a
# rule-verifier score on the final boxes only (thinking is stripped); confirm_discrim_acc
# tracks whether the internal [confirm] verdict matches the GT (world-model discriminator).
paths:
  dataset_root: /root/data-fs/bljiao/datasets
  output_dir: ./outputs/train/qwen35_2b_world_model_rl_768_zoom
runtime:
  mode: train
  run_name: qwen35_2b_world_model_rl_zoom
  auto_create_output_dir: true
tensorboard:
  port: 5010
  host: 0.0.0.0
  log_every_n_steps: 10
  vis_every_n_steps: 20
  vis_num_samples: 5
model:
  random_init_llm: false
  arch: Qwen3.5-2B
  name: /root/data-fs/bljiao/anomaly_llm/model_card/Qwen3.5-2B
  local_files_only: true
  freeze_vit: true
  torch_dtype: bfloat16
prior:
  layer_index_base: 1
  layer_indices:
  - 12
  - 16
  - 20
  - 24
  softmax_temperature: 0.5
  neighborhood_radius: 0
  render: colormap
  overlay_alpha: 0.45
lora:
  enabled: true
  skip_visual: true
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  - in_proj_qkv
  - in_proj_z
  - in_proj_a
  - in_proj_b
  - out_proj
data:
  train_layout: visa
  train_root: /root/data-fs/bljiao/datasets/VisA
  eval_layout: mvtec
  eval_root: /root/data-fs/bljiao/datasets/mvtec_anomaly_detection
  visa_max_normal_per_class: null
  min_contour_area: 5
  merge_kernel_ratio: 0.01
  gt_source: annos
  annos_root: /root/data-fs/bljiao/anomaly_llm/datasets/ANNOS
  source_dirname: VisA
  train_anomaly_only: false
  random_train_ref: true
  ref_topk: 5
  normal_anomaly_ratio: 1.0
  # Synthetic-defect augmentation: for each normal query, inject `per_normal`
  # self-labeled defects (small/medium/large) into the inspection image. The GT
  # boxes come from the injected patch's connected components, and the H-map
  # naturally fires on the patch (ref-vs-test distance), so these samples stay
  # consistent with the H-Box / H-VPT / H-candidate pipeline.
  synthetic_anomaly:
    enabled: false
    per_normal: 1
    size_bins: [small, medium, large]
  holdout_ratio: 0.0   # full VisA for training; evaluation is entirely on MVTec
  max_samples: null
  max_eval_samples: null
  max_image_size: 768
  factor: null
  min_pixels: null
  max_pixels: null
prompt:
  enable_thinking: true
  template: |
    Image 1 is a defect-free reference of {class_name}. Image 2 is the inspection image.
    An external anomaly-prior heatmap is provided as a search hint: it highlights the
    candidate regions where the inspection image most differs from the reference. Each
    candidate region is encoded as a geometry token (location and extent) embedded in this
    prompt: {h_box_tokens}. A dense visual-prior cross-attention is additionally injected
    via control/feature tokens: {h_vpt_tokens}. These are only heuristics, not labels —
    some may be false alarms, and real defects may be unmarked or imperfectly centered.
    Inspect the images directly, verify each candidate against the Image 1 baseline, and
    expand beyond the hint when needed.
    Reason inside your thinking as: understand the reference, compare the differences and
    why, localize candidate boxes, imagine whether each candidate actually matches the
    defect (keep / refine / reject / none), then confirm the decision that follows from
    your rehearsal (keep / refine / reject / none). Finally output only <answer>.
    In your thinking and in the "description" field, describe each anomaly in your own
    words: what you actually observe in that region and why it cannot be normal for this
    object, instead of only saying it "differs from the baseline".
    Example (anomalous): <answer>{"is_anomaly": true, "bboxes_2d": [[120, 200, 480, 620]], "description": "a defect on the upper-left"}</answer>
    Example (normal): <answer>{"is_anomaly": false, "bboxes_2d": [], "description": "no defect; appearance matches the reference"}</answer>
    For anomaly=true, bboxes_2d contains one box per spatially disconnected anomalous region, with no duplicates and at most {max_boxes} boxes.
    For anomaly=false, bboxes_2d MUST be [].
    All boxes are integers [x1,y1,x2,y2] in [0,1000] for Image 2 FULL IMAGE, with x1<x2 and y1<y2 (x1=left, y1=top, x2=right, y2=bottom).
    Stop immediately after </answer>.
training:
  max_length: 4096
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  seed: 42
  eval_every_n_steps: 20
  eval_split: test
  eval_num_samples: 200
  final_eval_num_samples: null
grpo:
  group_size: 8
  policy_epochs: 3
  epochs: 1
  max_attempts: null
  learning_rate: 5.0e-06
  gradient_accumulation_steps: 1
  max_new_tokens: 1024
  rollout_micro_batch_size: 8
  logprob_micro_batch_size: 4
  actor_micro_batch_size: 4
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  scale_rewards: true
  clip_low: 0.2
  clip_high: 0.28
  kl_beta: 0.0002
  max_grad_norm: 1.0
  save_steps: 20
  logprob_error_tolerance: 0.1
  # Per-token advantage: localization tokens ([localize] + bboxes_2d) get their
  # own group-normalized loc_reward advantage so coordinate gradients are not
  # averaged away by the long prose/confirm text (fixes the mIoU plateau).
  per_token_advantage: true
distributed:
  num_gpu: 1
  deepspeed: null
  local_rank: -1
  ddp_find_unused_parameters: true
outcome:
  version: outcome-multibox-v1
  protocol_weight: 0.01
  max_boxes: 16
  reasoning_mode: fsm
  thinking:
    enabled: true
  localization:
    iou_threshold: 0.30
    geometry_weight: 0.30
  reward:
    normal_correct: 1.0
    wrong_decision: -1.0
    false_positive_penalty: -2.0
    cls_weight: 0.0
    iou_weight: 1.0
    count_weight: 0.1
    dense_weight: 0.5
    focus_weight: 0.2
    focus_max_candidates: 3
    refine_weight: 0.1
    refine_clip: 0.2
    cand_weight: 0.1
    cand_iou_threshold: 0.1
    # World-model rehearsal calibration — two orthogonal questions:
    #   * [imagine] predicts the candidate box's objective quality (keep/refine/reject/
    #     none), scored against objective_verdict (imagine_calib_acc).
    #   * [confirm] predicts the refine loop's net effect (improved/unchanged/degraded),
    #     scored against sign(delta_refine) (confirm_discrim_acc).
    # keep_iou_threshold splits keep (box essentially right) from refine (box
    # undershoots/shifted); refine_eps absorbs numeric noise when thresholding the
    # delta_refine sign (a first-round box that is already right is "unchanged").
    discrim_weight: 0.1    # final [confirm] refine-loop verdict vs sign(delta_refine)
    imagine_weight: 0.1    # [imagine] box-quality rehearsal vs objective verdict
    keep_iou_threshold: 0.5
    refine_eps: 0.05
  resampling:
    min_loc_range: 0.001
    max_group_resamples: 3
  sft_adapter: outputs/train/world_model_sft_2b_hvpt_768_zoom_staged
  # H-Box geometry-token prior (static linear projection, no gate / no cross-attn):
  # H connected-component boxes -> geometry vectors -> <|h_box|> placeholder embeddings.
  h_box_prior:
    enabled: true
    max_boxes: 3            # K <|h_box|> slots (== prior.max_candidates)
    geom_dim: 11
  # H-VPT dense cross-attention (dynamic H channel): H patch map -> z_H -> control-token
  # cross-attn -> h_H scattered into <|h_ctrl|> + N <|h_feat|> slots. Loaded frozen from
  # outcome.sft_adapter/h_vpt.pt. trainable=gate_only (reward shapes only the scalar gate;
  # training the projector softmax caused KL explosion in the old runs).
  h_vpt:
    enabled: true
    condition: real
    n_tokens: 64
    mem_dim: 256
    num_heads: 8
    init_gate: 0.001
    trainable: gate_only
    lr: 0.001
  final_test: false
  # Zoom-crop visual observation step (world-model "look at the box before you
  # commit"). After the latent [localize] pass, the first candidate box is cropped
  # as a padded window (with the box outline drawn) and re-encoded at high
  # resolution, then a second 3-image pass (ref + test + crop) writes
  # [imagine]/[confirm]. Only affects evaluation/prediction (group==1); the group
  # rollout falls back to single-pass.
  zoom:
    enabled: true
    expand: 0.3            # per-side pad = expand * box size
    min_pad_frac: 0.04     # window floor = min_pad_frac * image longer side
    max_area_frac: 0.6     # degrade to global view when the window covers this fraction
    coverage_scan: false   # also scan the whole image for single candidates (ablation)
    crop_min_pixels: null  # crop upscale budget floor (null -> max_image_size^2 // 2)
    # Scheme-B RL zoom: this fraction of single-box anomalous training samples is
    # upgraded to a 3-image batch whose crop is built from a fixed shrink-GT
    # candidate box (so the whole GRPO group shares one 3-image cache). Matches the
    # SFT zoom_prob so train/eval both feed the model a zoomed, outline-drawn crop.
    train_prob: 0.3
    shrink_scale: 0.5      # fixed candidate = GT box shrunk to this scale
  prior:
    relative_threshold: 0.7
    raw_threshold: null
    max_candidates: 3
    min_cells: 1
    box_mode: full
    peak_radius: 1
    peak_keep: 0.85
    region_feature_index: 23
