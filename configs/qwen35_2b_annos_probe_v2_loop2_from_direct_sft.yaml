# Internal-Loop (latent-space recurrent-depth) SFT, branched from the converged Direct-SFT.
# Single-stage: Direct (K=1) -> K=2. The RegionAdapter is frozen via --freeze-region-adapter
# so only the LoRA trains; this isolates the reasoning mechanism (recurrent depth).
# Run: python train_region_sft.py --config configs/qwen35_2b_annos_probe_v2_loop2_from_direct_sft.yaml \
#        --init-sft outputs/train/region_sft_direct_e3 --freeze-region-adapter \
#        --output-dir outputs/train/region_sft_loop2_from_direct --epochs 1 --num-gpu 1
paths:
  dataset_root: /root/data-fs/bljiao/datasets
  output_dir: ./outputs/train/qwen35_2b_outcome_multibox
runtime:
  mode: train
  run_name: qwen35_2b_annos_probe_v2_loop2_from_direct
  auto_create_output_dir: true
tensorboard:
  port: 5014
  host: 0.0.0.0
  log_every_n_steps: 10
  vis_every_n_steps: 20
  vis_num_samples: 5
model:
  random_init_llm: false
  arch: Qwen3.5-2B
  name: /root/data-fs/bljiao/anomaly_llm/model_card/Qwen3.5-2B
  local_files_only: true
  freeze_vit: true
  torch_dtype: bfloat16
prior:
  layer_index_base: 1
  layer_indices:
  - 12
  - 16
  - 20
  - 24
  softmax_temperature: 0.5
  neighborhood_radius: 0
  render: colormap
  overlay_alpha: 0.45
lora:
  enabled: true
  skip_visual: true
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  - in_proj_qkv
  - in_proj_z
  - in_proj_a
  - in_proj_b
  - out_proj
data:
  train_layout: visa
  train_root: /root/data-fs/bljiao/datasets/VisA
  eval_layout: mvtec
  eval_root: /root/data-fs/bljiao/datasets/mvtec_anomaly_detection
  visa_max_normal_per_class: null
  min_contour_area: 5
  merge_kernel_ratio: 0.01
  gt_source: annos
  annos_root: /root/data-fs/bljiao/anomaly_llm/datasets/ANNOS
  source_dirname: VisA
  train_anomaly_only: false
  random_train_ref: true
  ref_topk: 5
  normal_anomaly_ratio: 1.0
  holdout_ratio: 0.1
  max_samples: null
  max_eval_samples: null
  max_image_size: 448
  factor: null
  min_pixels: null
  max_pixels: null
prompt:
  enable_thinking: false   # loop/direct: no native <think>; answer-only supervision
  template: |
    Image 1 is a defect-free reference of {class_name}. Image 2 is the inspection image.
    A set of region evidence tokens follows, grouped by H candidate: {region_tokens}. Each token encodes the inspection content at that location, its matched normal counterpart, and the discrepancy between them. hK@[x,y] marks the H peak on Image 2 in [0,1000] for the first token of that group; tokens after it describe the same H region, not only the peak cell. Hints are noisy, not labels: a marked location may be a false alarm (reflection, texture, print), and real defects may be unmarked. Start from these regions when proposing boxes, expand to the full differing structure, and search beyond the marked locations too.
    bboxes_2d is a list of boxes, and each box is itself a list [x1,y1,x2,y2]. A single defect must be written as [[x1,y1,x2,y2]] (a list containing one box), never as the flat list [x1,y1,x2,y2].
    Example (anomalous): <answer>{"is_anomaly": true, "bboxes_2d": [[120, 200, 480, 620]], "description": "a defect on the upper-left"}</answer>
    Example (normal): <answer>{"is_anomaly": false, "bboxes_2d": [], "description": "no defect; appearance matches the reference"}</answer>
    For anomaly=true, bboxes_2d contains one box per spatially disconnected anomalous region, with no duplicates and at most {max_boxes} boxes.
    For anomaly=false, bboxes_2d MUST be [].
    All boxes are integers [x1,y1,x2,y2] in [0,1000] for Image 2 FULL IMAGE, with x1<x2 and y1<y2 (x1=left, y1=top, x2=right, y2=bottom).
    Stop immediately after </answer>.
training:
  max_length: 4096
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  seed: 42
  eval_every_n_steps: 100
  eval_split: test
  eval_num_samples: 200
  final_eval_num_samples: null
grpo:
  group_size: 8
  policy_epochs: 3
  epochs: 2
  max_attempts: null
  learning_rate: 5.0e-06
  gradient_accumulation_steps: 1
  max_new_tokens: 512
  rollout_micro_batch_size: 8
  logprob_micro_batch_size: 8
  actor_micro_batch_size: 8
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  scale_rewards: true
  clip_low: 0.2
  clip_high: 0.28
  kl_beta: 0.0002
  max_grad_norm: 1.0
  save_steps: 100
  logprob_error_tolerance: 0.1
distributed:
  num_gpu: 1
  deepspeed: null
  local_rank: -1
  ddp_find_unused_parameters: false
outcome:
  version: outcome-multibox-v1
  protocol_weight: 0.01
  max_boxes: 16
  reasoning_mode: loop   # direct | loop | fsm
  thinking:
    enabled: false
  loop:
    enabled: true
    steps: 2
  localization:
    iou_threshold: 0.30
    geometry_weight: 0.30
  reward:
    normal_correct: 1.0
    wrong_decision: -1.0
    false_positive_penalty: -2.0
    cls_weight: 0.0
    iou_weight: 0.5
    count_weight: 0.2
    dense_weight: 0.3
    focus_weight: 0.0
    focus_max_candidates: 3
    refine_weight: 0.0
    refine_clip: 0.2
    cand_weight: 0.0
    cand_iou_threshold: 0.1
    cand_max_area_frac: 0.1
  resampling:
    min_loc_range: 0.001
    max_group_resamples: 3
  sft_adapter: outputs/train/region_sft_loop2_from_direct
  final_test: false
  prior:
    condition: real
    relative_threshold: 0.7
    raw_threshold: null
    max_candidates: 3
    min_cells: 1
    box_mode: full
    peak_radius: 1
    peak_keep: 0.85
    region_feature_index: 23
  region:
    intermediate_dim: 256
    geometry_dim: 5
    hstat_dim: 2
    activation: gelu
    max_cells: 15
    token_mode: hybrid
  zoom:
    enabled: false
    h_image_size: 768
    crop_image_size: 448
    expand: 1.5
    max_crops: 3
